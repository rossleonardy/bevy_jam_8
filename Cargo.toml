[package]
name = "bevy_jam_8"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.20.1", features = ["dynamic_linking"] }
bevy-inspector-egui = "0.38"
bevy_enhanced_input = "0.27.2"
bevy_transform_interpolation = "0.6.0"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
